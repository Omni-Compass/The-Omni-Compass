name: realms
# The 656-muscle tower on GitHub's own machine: every muscle alone and the five organisms (each realm and the whole tower),
# native against Omni-Compass on top, on the preregistered seeds (docs/REALMS_PREREGISTRATION.md, round 3).
# The run is deterministic: every label in its MUSCLES.csv must match the one committed in results/realms/, and every
# number to 1e-3 or 0.5% (Python versions differ in the last digits), so anyone can check the published table. Started by hand (Actions -> realms -> Run workflow) or by a commit message containing [realms].
on:
  workflow_dispatch:
  push:
jobs:
  realms:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[realms]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: The harness's own checks
        run: python3 tests/test_realms.py
      - name: Every muscle and the five organisms (seeds 3000-3009)
        run: python3 tools/run_realms.py --out realms-out
      - name: Same table as the one published
        run: |
          # every muscle's label identical, every number within 1e-3 or 0.5% (the last digits differ between Python versions,
          # which add floating-point numbers in a different order)
          set -o pipefail
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import csv, sys
          a = list(csv.DictReader(open("realms-out/MUSCLES.csv"))); b = list(csv.DictReader(open("results/realms/MUSCLES.csv")))
          assert len(a) == len(b) == 656
          bad = []
          for x, y in zip(a, b):
              for k in x:
                  try:
                      fx, fy = float(x[k]), float(y[k])
                      ok = abs(fx - fy) <= max(1e-3, 0.005 * abs(fy))
                  except ValueError:
                      ok = x[k] == y[k]
                  if not ok:
                      bad.append((x["muscle"], k, x[k], y[k]))
          print(f"published table reproduced: 656 muscles, {len(bad)} differences beyond 1e-3 (or 0.5%), labels identical: {not any(k == 'label' for _, k, _, _ in bad)}")
          for d in bad:
              print("  differs:", d)
          sys.exit(1 if bad else 0)
          PY
      - name: Results summary
        if: always()
        run: sed -n '/## The five organisms/,/## Every muscle/p' realms-out/REALMS.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: realms-results, path: realms-out}
