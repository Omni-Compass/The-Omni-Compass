name: realms
# The 656-muscle tower on GitHub's own machine: every muscle alone and the five organisms (each realm and the whole tower),
# native against Omni-Compass on top, on the preregistered seeds (docs/REALMS_PREREGISTRATION.md, round 2).
# The run is deterministic: its MUSCLES.csv must match the one committed in results/realms/ byte for byte, so anyone can
# check the published table. Started by hand (Actions -> realms -> Run workflow) or by a commit message containing [realms].
on:
  workflow_dispatch:
  push:
jobs:
  realms:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[realms]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: The harness's own checks
        run: python3 tests/test_realms.py
      - name: Every muscle and the five organisms (seeds 2000-2009)
        run: python3 tools/run_realms.py --out realms-out
      - name: Same table as the one published
        run: |
          cmp realms-out/MUSCLES.csv results/realms/MUSCLES.csv && echo "MUSCLES.csv identical to results/realms/MUSCLES.csv" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Results summary
        if: always()
        run: sed -n '/## The five organisms/,/## Every muscle/p' realms-out/REALMS.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: realms-results, path: realms-out}
