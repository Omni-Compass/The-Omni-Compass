name: benchmark-reps
# Repeated live runs: native, watch (Omni-Compass runs but writes nothing: its cost of being there), omni (B: on top)
# and strict (C: Omni-Compass decides replicas and nodes) on identical
# six-worker kind clusters, several repetitions each, aggregated with paired intervals (tools/live_reps.py).
# Started by hand or by a pushed commit whose message contains [reps].
on:
  workflow_dispatch:
    inputs:
      duration_s: {description: "Measured seconds per run", default: "900"}
  push:
jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[reps]')
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: {arm: [native, watch, omni, strict], rep: [1, 2, 3, 4, 5]}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - uses: helm/kind-action@v1
        with: {cluster_name: "omni-bench", config: deploy/kind/cluster-full.yaml}
      - run: bash scripts/kind_bench.sh
        env:
          ARM: ${{ matrix.arm }}
          OUT_DIR: bench-${{ matrix.arm }}-${{ matrix.rep }}
          DURATION: ${{ github.event.inputs.duration_s || '900' }}
          CLOSURE: tuning/GLOBAL_LEAGUE_PREREGISTRATION.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "bench-${{ matrix.arm }}-${{ matrix.rep }}", path: "bench-${{ matrix.arm }}-${{ matrix.rep }}"}
  aggregate:
    needs: run
    if: always() && needs.run.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: {pattern: "bench-*", path: reps}
      - run: python tools/live_reps.py reps
      - run: cat reps/LIVE_REPS.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: {name: live-reps, path: "reps/LIVE_REPS.*"}
