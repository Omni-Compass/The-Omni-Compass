# Official Kubernetes HPA walkthrough workload (registry.k8s.io/hpa-example) with a CPU-based HPA.
apiVersion: apps/v1
kind: Deployment
metadata: {name: php-apache}
spec:
  selector: {matchLabels: {run: php-apache}}
  template:
    metadata: {labels: {run: php-apache}}
    spec:
      containers:
        - name: php-apache
          image: registry.k8s.io/hpa-example
          ports: [{containerPort: 80}]
          resources: {limits: {cpu: 500m}, requests: {cpu: 200m}}
          # standard serving hygiene: traffic only once Apache answers, and on shutdown keep serving 5 s while the
          # endpoint is withdrawn from kube-proxy (without it, a request routed in that window fails: the one failed
          # probe request in live set 9, strict arm). Same in every arm; Kubernetes alone never evicts here.
          readinessProbe: {tcpSocket: {port: 80}, periodSeconds: 2}
          lifecycle: {preStop: {exec: {command: ["sleep", "5"]}}}
---
apiVersion: v1
kind: Service
metadata: {name: php-apache, labels: {run: php-apache}}
spec:
  ports: [{port: 80}]
  selector: {run: php-apache}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: php-apache}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: php-apache}
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 50}}
