# Multi-node kind cluster for the full-engine pilot: one control plane (runs the load generator and system
# add-ons, never parked) and three workers that form the node pool Omni-Compass sizes.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
  - role: worker
  - role: worker
