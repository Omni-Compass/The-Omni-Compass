# Load generator for the full-engine pilot, pinned to the control plane so draining a worker never stops the traffic.
apiVersion: apps/v1
kind: Deployment
metadata: {name: load-generator}
spec:
  replicas: 1
  selector: {matchLabels: {app: load-generator}}
  template:
    metadata: {labels: {app: load-generator}}
    spec:
      nodeSelector: {node-role.kubernetes.io/control-plane: ""}
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      containers:
        - name: load
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - while true; do for i in $$(seq 1 20); do wget -q -O- http://php-apache >/dev/null; done; sleep $$((RANDOM % 3)); done
